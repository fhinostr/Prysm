<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Book | Prysm</title>
  <meta name="description" content="Premium ABA data collection interface with skill acquisition and problem behavior tracking.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="app-container bcba-container">
    <header class="app-header glass-panel">
      <div class="header-left">
        <div class="brand-chip" style="padding-bottom: 0;"><img src="assets/prysm-logo-new.png" alt="Prysm" class="brand-chip-logo-horizontal"></div>
        <a href="treatment-plan.html" class="glass-btn btn-sm hub-back-btn" style="margin-left: 1rem; transform: translateY(-8px);">
          <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i> All Clients
        </a>
      </div>
      <nav class="site-toggle" aria-label="Site Navigation"><a href="index.html" class="site-toggle-link">Home</a>
        <a href="treatment-plan.html" class="site-toggle-link active" aria-current="page">Clients</a>
        <a href="billing.html" class="site-toggle-link">Billing</a>
        <a href="files.html" class="site-toggle-link">Files</a>
        <a href="contacts.html" class="site-toggle-link">Staff</a>
      </nav>
      <button class="mobile-menu-btn" aria-label="Open Menu" style="margin-left: auto; margin-right: 1rem;"><i data-lucide="menu"></i></button><div class="header-right" style="display: flex; gap: 0.5rem; justify-content: flex-end; align-items: center; min-width: 140px;">
        <div style="font-variant-numeric: tabular-nums; font-weight: 600; color: var(--color-blue-dark); margin-right: 0.5rem;" id="session-timer">00:00:00</div>
        <button class="glass-btn btn-sm" id="btn-session-toggle" onclick="toggleMainSession()" aria-label="Start Session" style="padding: 0.5rem;">
          <i data-lucide="play" id="icon-session-toggle"></i>
        </button>
        <button class="glass-btn btn-sm text-red" id="btn-session-end" onclick="endMainSession()" aria-label="End Session" style="padding: 0.5rem; display: none;">
          <i data-lucide="square"></i>
        </button>
        <button class="glass-btn btn-sm" onclick="signOut()" title="Sign Out" style="padding: 0.5rem;" aria-label="Sign Out"><i data-lucide="log-out"></i></button>
      </div>
    </header>

    <!-- ═══ SUB-NAV TOGGLE (now buttons, not links) ═══ -->
    <div class="subnav-shell">
      <nav class="view-toggle" aria-label="Treatment Plan Views">
        <button class="view-toggle-link active" data-pane="0" onclick="switchMainPane(0)">Session Book</button>
        <button class="view-toggle-link" data-pane="1" onclick="switchMainPane(1)">Treatment Planning</button>
      </nav>
    </div>

    <!-- ═══ MAIN VIEWPORT SLIDER ═══ -->
    <div class="main-viewport-wrapper">
      <div class="main-viewport-slider" id="main-viewport-slider">

        <!-- ─── PANE 0: SESSION BOOK ─── -->
        <div class="main-viewport-pane active" id="pane-session-book">
          <div class="scrollable-content">
            <section class="skill-targets-section" aria-labelledby="skills-heading">
              <h2 id="skills-heading" class="section-title">Skill Acquisition Targets</h2>
              <div id="skill-targets-container"></div>
            </section>
            <div class="footer-spacer"></div>
          </div>

          <footer class="problem-targets-section glass-panel-dock" aria-labelledby="problem-heading">
            <h2 id="problem-heading" class="section-title text-red">Problem Behaviors</h2>
            <div class="dock-items" id="problem-targets-container"></div>
          </footer>
        </div>

        <!-- ─── PANE 1: TREATMENT PLANNING ─── -->
        <div class="main-viewport-pane" id="pane-treatment-planning">
          <div class="bcba-container-main" style="max-width: 800px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; flex: 1; overflow: hidden;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding: 0 1rem; margin-top: 1rem;">
              <div style="display: flex; align-items: center; gap: 1rem;">
                <h2 class="section-title" style="margin: 0;">Program Library</h2>
                <select id="group-program-filter" class="glass-select" style="display: none; padding: 0.35rem 1rem; font-size: 0.85rem;" onchange="renderLibrary()">
                  <option value="group">Entire Group Cohort</option>
                </select>
              </div>
              <button class="glass-btn btn-primary" onclick="openTargetModal()">
                <i data-lucide="plus"></i> Add New Target
              </button>
            </div>
            
            <div class="scrollable-content" style="padding: 0 1rem; margin-top: 1rem; flex: 1;">
              <h3 style="color: var(--color-blue-dark); margin-bottom: 0.75rem; font-size: 1.1rem;">Skill Acquisition</h3>
              <div id="bcba-skill-targets-container" style="margin-bottom: 2rem;">
                <!-- Populated by JS -->
              </div>

              <h3 style="color: var(--color-red); margin-bottom: 0.75rem; font-size: 1.1rem;">Problem Behaviors</h3>
              <div id="bcba-problem-targets-container">
                <!-- Populated by JS -->
              </div>
            </div>
          </div>

          <!-- Form Builder Modal -->
          <div class="modal-overlay" id="target-modal-overlay" style="display: none; z-index: 1000;">
            <div class="glass-modal" style="width: 90%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column;">
              <div class="modal-header" style="position: relative; padding: 1.5rem; flex-shrink: 0;">
                <h2 id="target-modal-title">Create New Target</h2>
                <button class="btn-icon" onclick="closeTargetModal()" aria-label="Close" style="position: absolute; top: 1.5rem; right: 1.5rem;">
                  <i data-lucide="x"></i>
                </button>
              </div>
              <div class="modal-body scrollable-content" style="padding: 0 1.5rem 1.5rem 1.5rem;">
                <form id="target-builder-form" onsubmit="handleFormSubmit(event)">
                  
                  <div class="form-row">
                    <div class="form-group flex-2">
                      <label for="target-name">Target Name</label>
                      <input type="text" id="target-name" class="glass-input" placeholder="e.g. Tying Shoes" required>
                    </div>
                    <div class="form-group flex-1">
                      <label for="target-domain">Domain</label>
                      <select id="target-domain" class="glass-select" onchange="updateDomainStyling()">
                        <option value="skill">Skill Acquisition</option>
                        <option value="problem">Problem Behavior</option>
                      </select>
                    </div>
                  </div>

                  <!-- Group Assignment UI (Injected dynamically if group) -->
                  <div class="form-group" id="group-assignment-container" style="display: none; background: rgba(32,178,170,0.1); border: 1px dashed rgba(32,178,170,0.4); border-radius: 8px; padding: 1rem; margin-top: 0.5rem; margin-bottom: 0.5rem;">
                    <label style="color: var(--color-blue-dark); font-weight: 600;">Target Assignment (Group Cohort)</label>
                    <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                      <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer;">
                        <input type="radio" name="target-assignment-type" value="all" checked onchange="toggleGroupAssignmentSelect()">
                        <span>Apply to entire group</span>
                      </label>
                      <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer;">
                        <input type="radio" name="target-assignment-type" value="specific" onchange="toggleGroupAssignmentSelect()">
                        <span>Apply to specific member</span>
                      </label>
                    </div>
                    <select id="target-assignment-member" class="glass-select" style="margin-top: 0.75rem; display: none;">
                      <!-- JS Populated -->
                    </select>
                  </div>

                  <div class="form-group" id="category-group">
                    <label for="target-category">Category</label>
                    <select id="target-category" class="glass-select">
                      <!-- Populated by JS -->
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="measurement-type">Measurement Type</label>
                    <div class="measurement-grid" id="measurement-grid">
                      <label class="measurement-card">
                        <input type="radio" name="measurement" value="percent" checked onchange="toggleDynamicFields()">
                        <div class="card-content">
                          <i data-lucide="check-circle"></i>
                          <span>% Correct</span>
                        </div>
                      </label>
                      <label class="measurement-card">
                        <input type="radio" name="measurement" value="ta" onchange="toggleDynamicFields()">
                        <div class="card-content">
                          <i data-lucide="list-ordered"></i>
                          <span>Task Analysis</span>
                        </div>
                      </label>
                      <label class="measurement-card">
                        <input type="radio" name="measurement" value="interval" onchange="toggleDynamicFields()">
                        <div class="card-content">
                          <i data-lucide="clock"></i>
                          <span>Interval</span>
                        </div>
                      </label>
                      <label class="measurement-card warning-card">
                        <input type="radio" name="measurement" value="frequency" onchange="toggleDynamicFields()">
                        <div class="card-content">
                          <i data-lucide="plus-circle"></i>
                          <span>Frequency</span>
                        </div>
                      </label>
                      <label class="measurement-card warning-card">
                        <input type="radio" name="measurement" value="duration" onchange="toggleDynamicFields()">
                        <div class="card-content">
                          <i data-lucide="timer"></i>
                          <span>Duration</span>
                        </div>
                      </label>
                    </div>
                  </div>

                  <!-- Dynamic Fields Container -->
                  <div id="dynamic-fields-container" class="dynamic-fields glass-panel-inner">
                    <!-- Populated by JS based on measurement type -->
                  </div>

                  <div class="form-group">
                    <label for="op-def">Operational Definition</label>
                    <textarea id="op-def" class="glass-input" rows="3" placeholder="Clearly define the target behavior..." required></textarea>
                  </div>

                  <div class="form-group">
                    <label for="procedures">Teaching Procedures / Reactive Strategies</label>
                    <textarea id="procedures" class="glass-input" rows="3" placeholder="Step-by-step instructions for the RBT..." required></textarea>
                  </div>

                  <!-- ── Mastery Criteria ─────────────────────────────────────── -->
                  <div class="form-group" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:12px;padding:1rem;">
                    <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.85rem;">
                      <i data-lucide="target" style="width:15px;height:15px;color:var(--color-blue-dark);"></i>
                      <span style="font-size:0.8rem;font-weight:700;letter-spacing:0.06em;color:var(--color-blue-dark);text-transform:uppercase;">Mastery Criteria</span>
                    </div>
                    <div id="mastery-criteria-fields">
                      <!-- Populated by updateMasteryCriteriaFields() -->
                    </div>
                  </div>

                  <!-- ── Phase & Staff ───────────────────────────────────────── -->
                  <div class="form-row">
                    <div class="form-group flex-1">
                      <label for="target-phase">Phase</label>
                      <select id="target-phase" class="glass-select">
                        <option value="Acquisition">Acquisition</option>
                        <option value="Fluency">Fluency</option>
                        <option value="Generalization">Generalization</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Intervention">Intervention</option>
                        <option value="Reduction">Reduction</option>
                      </select>
                    </div>
                    <div class="form-group flex-1">
                      <label for="target-last-staff" style="display:flex;align-items:center;gap:0.35rem;">
                        <i data-lucide="lock" style="width:12px;height:12px;opacity:0.5;"></i>
                        Last Graphed By <span style="font-size:0.7rem;font-weight:400;color:var(--color-text-light);margin-left:0.25rem;">(audit trail)</span>
                      </label>
                      <input type="text" id="target-last-staff" class="glass-input" readonly
                        style="cursor:default;opacity:0.65;background:rgba(255,255,255,0.15);" placeholder="—">
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group flex-1">
                      <label for="example">Example</label>
                      <textarea id="example" class="glass-input text-green-input" rows="2" placeholder="e.g. Saying 'blue' clearly"></textarea>
                    </div>
                    <div class="form-group flex-1">
                      <label for="non-example">Non-Example</label>
                      <textarea id="non-example" class="glass-input text-red-input" rows="2" placeholder="e.g. Saying 'ba' instead of blue"></textarea>
                    </div>
                  </div>

                  <button type="submit" class="glass-btn btn-primary" id="target-submit-btn" style="width: 100%; margin-top: 1rem; padding: 1rem;">
                    <i data-lucide="save"></i> Save Target to Program
                  </button>
                </form>
              </div>
            </div>
          </div>

          <!-- Graph Modal -->
          <div class="modal-overlay" id="bcba-graph-modal-overlay" style="display: none; z-index: 1000;">
            <div class="glass-modal" style="width: 90%; max-width: 800px;">
              <div class="modal-header" style="position: relative;">
                <h2 id="graph-modal-title">Target Graph</h2>
                <button class="btn-icon" onclick="document.getElementById('bcba-graph-modal-overlay').style.display = 'none'" aria-label="Close" style="position: absolute; top: 1rem; right: 1rem;">
                  <i data-lucide="x"></i>
                </button>
              </div>
              <div class="modal-body" style="padding: 1.5rem; background: var(--color-glass-dark); border-radius: 8px; margin: 1rem;">
                <div id="advanced-graph-container" style="position: relative; width: 100%; height: 300px;">
                  <!-- SVG will be injected here -->
                </div>
              </div>
            </div>
          </div>
        </div>

      </div><!-- end .main-viewport-slider -->
    </div><!-- end .main-viewport-wrapper -->
  </main>

  <!-- ═══ TARGET DRAWER (shared) ═══ -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>

  <aside class="glass-drawer" id="right-drawer">
    <div class="drawer-header">
      <h3 id="drawer-title">Target Menu</h3>
      <button class="btn-icon" onclick="closeDrawer()" aria-label="Close Drawer">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="drawer-tabs">
      <button class="drawer-tab active" onclick="switchDrawerTab(0)" id="tab-btn-info">Info</button>
      <button class="drawer-tab" onclick="switchDrawerTab(1)" id="tab-btn-data">Data</button>
      <button class="drawer-tab" onclick="switchDrawerTab(2)" id="tab-btn-notes">Notes</button>
      <span class="drawer-tab-pill" id="drawer-tab-pill"></span>
    </div>

    <div class="drawer-content">
      <div class="drawer-viewport-slider" id="drawer-viewport-slider">
        <div class="drawer-tab-pane active" id="drawer-pane-info">
          <div id="drawer-info-container"></div>
        </div>

        <div class="drawer-tab-pane" id="drawer-pane-data">
          <div class="past-data">
            <h4>Last 3 Sessions</h4>
            <div class="mini-line-graph" style="height: 140px; margin-top: 1rem; margin-left: 1.5rem; position: relative;">
              <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width: 100%; height: 100%; overflow: visible;">
                <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0,0,0,0.1)" stroke-width="0.5" />
                <line x1="0" y1="20" x2="100" y2="20" stroke="rgba(0,0,0,0.1)" stroke-width="0.5" />
                <line x1="0" y1="40" x2="100" y2="40" stroke="rgba(0,0,0,0.1)" stroke-width="0.5" />
                <line x1="0" y1="60" x2="100" y2="60" stroke="rgba(0,0,0,0.1)" stroke-width="0.5" />
                <line x1="0" y1="80" x2="100" y2="80" stroke="rgba(0,0,0,0.1)" stroke-width="0.5" />
                <line x1="0" y1="100" x2="100" y2="100" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
                <line x1="0" y1="0" x2="0" y2="100" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
                <polyline points="20,40 50,20 80,0" fill="none" stroke="black" stroke-width="2.5" stroke-linejoin="round" />
                <circle cx="20" cy="40" r="2.5" fill="black" />
                <circle cx="50" cy="20" r="2.5" fill="black" />
                <circle cx="80" cy="0" r="2.5" fill="black" />
              </svg>
              <div style="position: absolute; left: -25px; bottom: 0; font-size: 0.65rem; color: var(--color-text-light);">0</div>
              <div style="position: absolute; left: -30px; bottom: 50%; transform: translateY(50%); font-size: 0.65rem; color: var(--color-text-light);">50</div>
              <div style="position: absolute; left: -35px; top: -5px; font-size: 0.65rem; color: var(--color-text-light);">100</div>
              <div style="position: absolute; left: 20%; bottom: -30px; transform: translateX(-50%); font-size: 0.7rem; font-weight: 600; color: var(--color-text-light); text-align: center;">S1<br><span style="font-size:0.6rem;font-weight:normal">60%</span></div>
              <div style="position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%); font-size: 0.7rem; font-weight: 600; color: var(--color-text-light); text-align: center;">S2<br><span style="font-size:0.6rem;font-weight:normal">80%</span></div>
              <div style="position: absolute; left: 80%; bottom: -30px; transform: translateX(-50%); font-size: 0.7rem; font-weight: 600; color: var(--color-text-light); text-align: center;">S3<br><span style="font-size:0.6rem;font-weight:normal">100%</span></div>
            </div>
          </div>
          <button class="glass-btn btn-primary btn-sm btn-graph-current" id="btn-drawer-graph" onclick="graphDrawerCurrentData()">
            <i data-lucide="line-chart"></i> Graph Current Session
          </button>
        </div>

        <div class="drawer-tab-pane" id="drawer-pane-notes">
          <textarea class="glass-textarea drawer-textarea" id="drawer-notes-input" placeholder="Leave notes for treatment planning regarding this target..."></textarea>
          <button class="glass-btn btn-primary btn-sm" onclick="saveDrawerNote()">Save Note</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- ═══ END SESSION MODAL ═══ -->
  <div class="modal-overlay" id="graph-modal-overlay" style="display: none;">
    <div class="glass-modal">
      <div class="modal-header" style="position: relative;">
        <h2>End Session</h2>
        <button class="btn-icon" onclick="cancelEndSession()" aria-label="Cancel" style="position: absolute; top: 1rem; right: 1rem;">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <ul class="graph-target-list" id="modal-target-list"></ul>
      </div>
      <div class="modal-footer">
        <button class="glass-btn btn-primary" style="width: 100%;" onclick="submitGraphs()">Graph Selected Targets</button>
      </div>
    </div>
  </div>

  <!-- Supabase Auth Integration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=12"></script>
  <script src="auth-utils-v8.js?v=12"></script>
  <script src="auth-guard-v9.js?v=12"></script>
  <script src="supabase-data.js"></script>
  <script src="nav.js"></script>
  <script src="program-data.js"></script>
  <script src="app.js"></script>
  <script src="bcba.js"></script>
</body>
</html>
