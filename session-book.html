<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Book | Liquid Glass</title>
  <meta name="description" content="Premium ABA data collection interface with skill acquisition and problem behavior tracking.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="app-container bcba-container">
    <header class="app-header glass-panel">
      <div class="brand-chip"><img src="assets/prysm-logo-new.png" alt="Prysm" class="brand-chip-logo-horizontal"></div>
      <nav class="site-toggle" aria-label="Site Navigation"><button class="mobile-nav-close btn-icon" aria-label="Close Menu"><i data-lucide="x"></i></button>
        <a href="index.html" class="site-toggle-link">Home</a>
        <a href="treatment-plan.html" class="site-toggle-link active" aria-current="page">Clients</a>
        <a href="billing.html" class="site-toggle-link">Billing</a>
        <a href="files.html" class="site-toggle-link">Files</a>
        <a href="contacts.html" class="site-toggle-link">Staff</a>
        <a href="get-started.html" class="site-toggle-link">Get Started</a>
      </nav>
      <button class="mobile-menu-btn" aria-label="Open Menu" style="margin-left: auto; margin-right: 1rem;"><i data-lucide="menu"></i></button><div class="header-right" style="display: flex; gap: 0.5rem; justify-content: flex-end; align-items: center; min-width: 140px;">
        <div style="font-variant-numeric: tabular-nums; font-weight: 600; color: var(--color-blue-dark); margin-right: 0.5rem;" id="session-timer">00:00:00</div>
        <button class="glass-btn btn-sm" id="btn-session-toggle" onclick="toggleMainSession()" aria-label="Start Session" style="padding: 0.5rem;">
          <i data-lucide="play" id="icon-session-toggle"></i>
        </button>
        <button class="glass-btn btn-sm text-red" id="btn-session-end" onclick="endMainSession()" aria-label="End Session" style="padding: 0.5rem; display: none;">
          <i data-lucide="square"></i>
        </button>
      </div>
    </header>

    <div class="subnav-shell">
      <nav class="view-toggle" aria-label="Treatment Plan Views">
        <a href="session-book.html" class="view-toggle-link active" aria-current="page">Session Book</a>
        <a href="bcba.html" class="view-toggle-link">Treatment Planning</a>
        <a href="get-started.html" class="site-toggle-link">Get Started</a>
      </nav>
    </div>

    <div class="scrollable-content">
      <section class="skill-targets-section" aria-labelledby="skills-heading">
        <h2 id="skills-heading" class="section-title">Skill Acquisition Targets</h2>
        <div id="skill-targets-container"></div>
      </section>



      <div class="footer-spacer"></div>
    </div>

    <footer class="problem-targets-section glass-panel-dock" aria-labelledby="problem-heading">
      <h2 id="problem-heading" class="section-title text-red">Problem Behaviors</h2>
      <div class="dock-items" id="problem-targets-container"></div>
    </footer>
  </main>

  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>

  <aside class="glass-drawer" id="right-drawer">
    <div class="drawer-header">
      <h3 id="drawer-title">Target Menu</h3>
      <button class="btn-icon" onclick="closeDrawer()" aria-label="Close Drawer">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="drawer-tabs">
      <button class="drawer-tab active" onclick="switchDrawerTab('info')" id="tab-btn-info">Info</button>
      <button class="drawer-tab" onclick="switchDrawerTab('data')" id="tab-btn-data">Data</button>
      <button class="drawer-tab" onclick="switchDrawerTab('notes')" id="tab-btn-notes">Notes</button>
    </div>

    <div class="drawer-content">
      <div class="drawer-tab-pane active" id="drawer-pane-info">
        <div id="drawer-info-container"></div>
      </div>

      <div class="drawer-tab-pane" id="drawer-pane-data" style="display: none;">
        <div class="past-data">
          <h4>Last 3 Sessions</h4>
          <div class="mini-line-graph" style="height: 140px; margin-top: 1rem; margin-left: 1.5rem; position: relative;">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width: 100%; height: 100%; overflow: visible;">
              <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0,0,0,0.1)" stroke-width="0.5" />
              <line x1="0" y1="20" x2="100" y2="20" stroke="rgba(0,0,0,0.1)" stroke-width="0.5" />
              <line x1="0" y1="40" x2="100" y2="40" stroke="rgba(0,0,0,0.1)" stroke-width="0.5" />
              <line x1="0" y1="60" x2="100" y2="60" stroke="rgba(0,0,0,0.1)" stroke-width="0.5" />
              <line x1="0" y1="80" x2="100" y2="80" stroke="rgba(0,0,0,0.1)" stroke-width="0.5" />
              <line x1="0" y1="100" x2="100" y2="100" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
              <line x1="0" y1="0" x2="0" y2="100" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
              <polyline points="20,40 50,20 80,0" fill="none" stroke="black" stroke-width="2.5" stroke-linejoin="round" />
              <circle cx="20" cy="40" r="2.5" fill="black" />
              <circle cx="50" cy="20" r="2.5" fill="black" />
              <circle cx="80" cy="0" r="2.5" fill="black" />
            </svg>
            <div style="position: absolute; left: -25px; bottom: 0; font-size: 0.65rem; color: var(--color-text-light);">0</div>
            <div style="position: absolute; left: -30px; bottom: 50%; transform: translateY(50%); font-size: 0.65rem; color: var(--color-text-light);">50</div>
            <div style="position: absolute; left: -35px; top: -5px; font-size: 0.65rem; color: var(--color-text-light);">100</div>
            <div style="position: absolute; left: 20%; bottom: -30px; transform: translateX(-50%); font-size: 0.7rem; font-weight: 600; color: var(--color-text-light); text-align: center;">S1<br><span style="font-size:0.6rem;font-weight:normal">60%</span></div>
            <div style="position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%); font-size: 0.7rem; font-weight: 600; color: var(--color-text-light); text-align: center;">S2<br><span style="font-size:0.6rem;font-weight:normal">80%</span></div>
            <div style="position: absolute; left: 80%; bottom: -30px; transform: translateX(-50%); font-size: 0.7rem; font-weight: 600; color: var(--color-text-light); text-align: center;">S3<br><span style="font-size:0.6rem;font-weight:normal">100%</span></div>
          </div>
        </div>
        <button class="glass-btn btn-primary btn-sm btn-graph-current" id="btn-drawer-graph" onclick="graphDrawerCurrentData()">
          <i data-lucide="line-chart"></i> Graph Current Session
        </button>
      </div>

      <div class="drawer-tab-pane" id="drawer-pane-notes" style="display: none;">
        <textarea class="glass-textarea drawer-textarea" id="drawer-notes-input" placeholder="Leave notes for treatment planning regarding this target..."></textarea>
        <button class="glass-btn btn-primary btn-sm" onclick="saveDrawerNote()">Save Note</button>
      </div>
    </div>
  </aside>

  <div class="modal-overlay" id="graph-modal-overlay" style="display: none;">
    <div class="glass-modal">
      <div class="modal-header" style="position: relative;">
        <h2>End Session</h2>
        <button class="btn-icon" onclick="cancelEndSession()" aria-label="Cancel" style="position: absolute; top: 1rem; right: 1rem;">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <ul class="graph-target-list" id="modal-target-list"></ul>
      </div>
      <div class="modal-footer">
        <button class="glass-btn btn-primary" style="width: 100%;" onclick="submitGraphs()">Graph Selected Targets</button>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script src="program-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
