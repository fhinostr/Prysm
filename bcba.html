<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treatment Planning | Liquid Glass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="app-container bcba-container">
    <header class="app-header glass-panel">
      <div class="brand-chip"><img src="assets/prysm-logo-new.png" alt="Prysm" class="brand-chip-logo-horizontal"></div>
      <nav class="site-toggle" aria-label="Site Navigation"><button class="mobile-nav-close btn-icon" aria-label="Close Menu"><i data-lucide="x"></i></button>
        <a href="index.html" class="site-toggle-link">Home</a>
        <a href="treatment-plan.html" class="site-toggle-link active" aria-current="page">Clients</a>
        <a href="billing.html" class="site-toggle-link">Billing</a>
        <a href="files.html" class="site-toggle-link">Files</a>
        <a href="contacts.html" class="site-toggle-link">Staff</a>
        <a href="get-started.html" class="site-toggle-link">Get Started</a>
      </nav>
      <div class="header-right">
        <button class="glass-btn btn-sm" onclick="signOut()" title="Sign Out" style="padding: 0.5rem;" aria-label="Sign Out"><i data-lucide="log-out"></i></button>
        <button class="mobile-menu-btn" aria-label="Open Menu"><i data-lucide="menu"></i></button>
      </div>
    </header>

    <div class="subnav-shell">
      <nav class="view-toggle" aria-label="Treatment Plan Views">
        <a href="session-book.html" class="view-toggle-link">Session Book</a>
        <a href="bcba.html" class="view-toggle-link active" aria-current="page">Treatment Planning</a>
      </nav>
    </div>

    <div class="bcba-container-main" style="max-width: 800px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; flex: 1; overflow: hidden;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding: 0 1rem; margin-top: 1rem;">
        <h2 class="section-title" style="margin: 0;">Program Library</h2>
        <button class="glass-btn btn-primary" onclick="openTargetModal()">
          <i data-lucide="plus"></i> Add New Target
        </button>
      </div>
      
      <div class="scrollable-content" style="padding: 0 1rem; margin-top: 1rem; flex: 1;">
        <h3 style="color: var(--color-blue-dark); margin-bottom: 0.75rem; font-size: 1.1rem;">Skill Acquisition</h3>
        <div id="skill-targets-container" style="margin-bottom: 2rem;">
          <!-- Populated by JS -->
        </div>

        <h3 style="color: var(--color-red); margin-bottom: 0.75rem; font-size: 1.1rem;">Problem Behaviors</h3>
        <div id="problem-targets-container">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Form Builder Modal -->
    <div class="modal-overlay" id="target-modal-overlay" style="display: none; z-index: 1000;">
      <div class="glass-modal" style="width: 90%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column;">
        <div class="modal-header" style="position: relative; padding: 1.5rem; flex-shrink: 0;">
          <h2 id="target-modal-title">Create New Target</h2>
          <button class="btn-icon" onclick="closeTargetModal()" aria-label="Close" style="position: absolute; top: 1.5rem; right: 1.5rem;">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal-body scrollable-content" style="padding: 0 1.5rem 1.5rem 1.5rem;">
          <form id="target-builder-form" onsubmit="handleFormSubmit(event)">
            
            <div class="form-row">
              <div class="form-group flex-2">
                <label for="target-name">Target Name</label>
                <input type="text" id="target-name" class="glass-input" placeholder="e.g. Tying Shoes" required>
              </div>
              <div class="form-group flex-1">
                <label for="target-domain">Domain</label>
                <select id="target-domain" class="glass-select" onchange="updateDomainStyling()">
                  <option value="skill">Skill Acquisition</option>
                  <option value="problem">Problem Behavior</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="measurement-type">Measurement Type</label>
              <div class="measurement-grid" id="measurement-grid">
                <!-- Radio buttons styled as cards -->
                <label class="measurement-card">
                  <input type="radio" name="measurement" value="percent" checked onchange="toggleDynamicFields()">
                  <div class="card-content">
                    <i data-lucide="check-circle"></i>
                    <span>% Correct</span>
                  </div>
                </label>
                <label class="measurement-card">
                  <input type="radio" name="measurement" value="ta" onchange="toggleDynamicFields()">
                  <div class="card-content">
                    <i data-lucide="list-ordered"></i>
                    <span>Task Analysis</span>
                  </div>
                </label>
                <label class="measurement-card">
                  <input type="radio" name="measurement" value="interval" onchange="toggleDynamicFields()">
                  <div class="card-content">
                    <i data-lucide="clock"></i>
                    <span>Interval</span>
                  </div>
                </label>
                <label class="measurement-card warning-card">
                  <input type="radio" name="measurement" value="frequency" onchange="toggleDynamicFields()">
                  <div class="card-content">
                    <i data-lucide="plus-circle"></i>
                    <span>Frequency</span>
                  </div>
                </label>
                <label class="measurement-card warning-card">
                  <input type="radio" name="measurement" value="duration" onchange="toggleDynamicFields()">
                  <div class="card-content">
                    <i data-lucide="timer"></i>
                    <span>Duration</span>
                  </div>
                </label>
              </div>
            </div>

            <!-- Dynamic Fields Container -->
            <div id="dynamic-fields-container" class="dynamic-fields glass-panel-inner">
              <!-- Populated by JS based on measurement type -->
            </div>

            <div class="form-group">
              <label for="op-def">Operational Definition</label>
              <textarea id="op-def" class="glass-input" rows="3" placeholder="Clearly define the target behavior..." required></textarea>
            </div>

            <div class="form-group">
              <label for="procedures">Teaching Procedures / Reactive Strategies</label>
              <textarea id="procedures" class="glass-input" rows="3" placeholder="Step-by-step instructions for the RBT..." required></textarea>
            </div>

            <!-- ── Mastery Criteria ─────────────────────────────────────── -->
            <div class="form-group" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:12px;padding:1rem;">
              <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.85rem;">
                <i data-lucide="target" style="width:15px;height:15px;color:var(--color-blue-dark);"></i>
                <span style="font-size:0.8rem;font-weight:700;letter-spacing:0.06em;color:var(--color-blue-dark);text-transform:uppercase;">Mastery Criteria</span>
              </div>
              <div id="mastery-criteria-fields">
                <!-- Populated by updateMasteryCriteriaFields() -->
              </div>
            </div>

            <!-- ── Phase & Staff ───────────────────────────────────────── -->
            <div class="form-row">
              <div class="form-group flex-1">
                <label for="target-phase">Phase</label>
                <select id="target-phase" class="glass-select">
                  <option value="Acquisition">Acquisition</option>
                  <option value="Fluency">Fluency</option>
                  <option value="Generalization">Generalization</option>
                  <option value="Maintenance">Maintenance</option>
                  <option value="Intervention">Intervention</option>
                  <option value="Reduction">Reduction</option>
                </select>
              </div>
              <div class="form-group flex-1">
                <label for="target-last-staff" style="display:flex;align-items:center;gap:0.35rem;">
                  <i data-lucide="lock" style="width:12px;height:12px;opacity:0.5;"></i>
                  Last Graphed By <span style="font-size:0.7rem;font-weight:400;color:var(--color-text-light);margin-left:0.25rem;">(audit trail)</span>
                </label>
                <input type="text" id="target-last-staff" class="glass-input" readonly
                  style="cursor:default;opacity:0.65;background:rgba(255,255,255,0.15);" placeholder="—">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group flex-1">
                <label for="example">Example</label>
                <textarea id="example" class="glass-input text-green-input" rows="2" placeholder="e.g. Saying 'blue' clearly"></textarea>
              </div>
              <div class="form-group flex-1">
                <label for="non-example">Non-Example</label>
                <textarea id="non-example" class="glass-input text-red-input" rows="2" placeholder="e.g. Saying 'ba' instead of blue"></textarea>
              </div>
            </div>

            <button type="submit" class="glass-btn btn-primary" id="target-submit-btn" style="width: 100%; margin-top: 1rem; padding: 1rem;">
              <i data-lucide="save"></i> Save Target to Program
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Graph Modal -->
    <div class="modal-overlay" id="graph-modal-overlay" style="display: none; z-index: 1000;">
      <div class="glass-modal" style="width: 90%; max-width: 800px;">
        <div class="modal-header" style="position: relative;">
          <h2 id="graph-modal-title">Target Graph</h2>
          <button class="btn-icon" onclick="document.getElementById('graph-modal-overlay').style.display = 'none'" aria-label="Close" style="position: absolute; top: 1rem; right: 1rem;">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal-body" style="padding: 1.5rem; background: var(--color-glass-dark); border-radius: 8px; margin: 1rem;">
          <div id="advanced-graph-container" style="position: relative; width: 100%; height: 300px;">
            <!-- SVG will be injected here -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Supabase Auth Integration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth-guard.js"></script>
  <script src="supabase-data.js"></script>
  <script src="nav.js"></script>
  <script src="program-data.js"></script>
  <script src="bcba.js"></script>
</body>
</html>
