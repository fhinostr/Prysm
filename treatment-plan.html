<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients | Liquid Glass</title>
  <meta name="description" content="Client directory with links to individual treatment plans.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="marketing-page">
  <div class="app-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="app-container home-container">
    <header class="app-header glass-panel">
      <div class="brand-chip"><img src="assets/prysm-logo-new.png" alt="Prysm" class="brand-chip-logo-horizontal"></div>
      <nav class="site-toggle" aria-label="Site Navigation"><a href="index.html" class="site-toggle-link">Home</a>
        <a href="treatment-plan.html" class="site-toggle-link active" aria-current="page">Clients</a>
        <a href="billing.html" class="site-toggle-link">Billing</a>
        <a href="files.html" class="site-toggle-link">Files</a>
        <a href="contacts.html" class="site-toggle-link">Staff</a>
      </nav>
            <div class="header-right" style="display: flex; align-items: center; gap: 0.75rem;">
        <a href="login.html" id="auth-sign-in-btn" class="glass-btn btn-sm" style="display: none; white-space: nowrap;">Sign In</a>
        <div id="auth-profile-menu" style="display: none; align-items: center; gap: 0.5rem;">
          <div id="auth-user-avatar" style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--color-blue), var(--color-turquoise)); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1rem; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">?</div>
          <span id="auth-user-name" style="font-size: 0.9rem; font-weight: 600; color: var(--color-blue-dark); display: none;"></span>
          <button class="glass-btn btn-sm" onclick="signOut()" title="Sign Out" style="padding: 0.5rem;" aria-label="Sign Out"><i data-lucide="log-out"></i></button>
        </div>
        <button class="mobile-menu-btn" aria-label="Open Menu"><i data-lucide="menu"></i></button>
      </div>
    </header>

    <section class="hub-hero glass-panel">
      <div>
        <span class="hero-eyebrow">Clients</span>
        <h1>Select a client</h1>
      </div>
    </section>

    <section class="client-list-shell">
      <article class="client-list-card glass-panel">
        <div class="client-list-header">
          <h2>Client List</h2>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span class="badge" id="client-count-badge">0 Clients</span>
            <button class="liquid-glass-blue-btn" id="btn-add-client" onclick="openCreateClientModal()" data-role-only="bcba">
              <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
              New Client
            </button>
          </div>
        </div>
        <div id="client-list"></div>
      </article>
    </section>
  </main>

  <!-- Create Client Modal -->
  <div class="modal-overlay" id="create-client-overlay" style="display: none;">
    <div class="glass-modal" style="width: 90%; max-width: 480px; max-height: 90vh; display: flex; flex-direction: column;">
      <div class="modal-header" style="position: relative; padding: 1.5rem; flex-shrink: 0;">
        <h2>Create New Client</h2>
        <p>Enter the clinical and demographic details below.</p>
        <button class="btn-icon" onclick="closeCreateClientModal()" aria-label="Close" style="position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; cursor: pointer; color: var(--color-text-light);">
          <i data-lucide="x" style="width: 18px; height: 18px;"></i>
        </button>
      </div>
      <form id="create-client-form" onsubmit="handleCreateClient(event)" class="modal-body scrollable-content" style="padding: 1.5rem; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;">
        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
          <label for="client-name" style="font-weight: 600; font-size: 0.85rem; color: var(--color-blue-dark);">Full Name *</label>
          <input type="text" id="client-name" class="glass-input" placeholder="e.g. Lucas Smith" required>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
          <label for="client-dob" style="font-weight: 600; font-size: 0.85rem; color: var(--color-blue-dark);">Date of Birth *</label>
          <input type="date" id="client-dob" class="glass-input" required>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
          <label for="client-caregiver" style="font-weight: 600; font-size: 0.85rem; color: var(--color-blue-dark);">Caregiver Name & Relationship</label>
          <input type="text" id="client-caregiver" class="glass-input" placeholder="e.g. Jane Smith — Mother">
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
          <label for="client-phone" style="font-weight: 600; font-size: 0.85rem; color: var(--color-blue-dark);">Phone Number</label>
          <input type="tel" id="client-phone" class="glass-input" placeholder="e.g. (555) 019-2834">
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
          <label for="client-diagnosis" style="font-weight: 600; font-size: 0.85rem; color: var(--color-blue-dark);">Diagnosis</label>
          <select id="client-diagnosis" class="glass-select">
            <option value="ASD Level 1">ASD Level 1</option>
            <option value="ASD Level 2" selected>ASD Level 2</option>
            <option value="ASD Level 3">ASD Level 3</option>
            <option value="Other">Other / Neurodevelopmental</option>
          </select>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
          <label for="client-clinical-id" style="font-weight: 600; font-size: 0.85rem; color: var(--color-blue-dark);">Clinical ID (Optional)</label>
          <input type="text" id="client-clinical-id" class="glass-input" placeholder="e.g. CLN-2026-004 (auto-generated if empty)">
        </div>

        <div id="create-client-error" style="color: var(--color-red); font-size: 0.85rem; display: none; padding: 0.5rem; border-radius: 8px; background: rgba(239, 68, 68, 0.1); margin-top: 0.25rem;"></div>

        <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem; justify-content: flex-end;">
          <button type="button" class="glass-btn" onclick="closeCreateClientModal()" style="background: transparent; padding: 0.6rem 1rem; font-size: 0.9rem;">Cancel</button>
          <button type="submit" id="btn-submit-client" class="glass-btn" style="background: linear-gradient(135deg, var(--color-blue), var(--color-turquoise)); color: white; border: none; padding: 0.6rem 1.25rem; font-size: 0.9rem;">Create Client</button>
        </div>
      </form>
    </div>
  </div>


  <!-- Supabase Auth Integration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=12"></script>
  <script src="auth-utils-v8.js?v=12"></script>
  <script src="auth-guard-v9.js?v=12"></script>
  <script src="supabase-data.js"></script>
  <script src="nav.js"></script>
  <script src="clients-data.js"></script>
  <script src="treatment-plan.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
