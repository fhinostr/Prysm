<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Liquid Glass</title>
  <meta name="description" content="Personalize your user profile.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="marketing-page">
  <div class="app-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="app-container home-container">
    <header class="app-header glass-panel">
      <div class="brand-chip"><img src="assets/prysm-logo-new.png" alt="Prysm" class="brand-chip-logo-horizontal"></div>
      <nav class="site-toggle" aria-label="Site Navigation">
        <a href="index.html" class="site-toggle-link">Home</a>
        <a href="treatment-plan.html" class="site-toggle-link">Clients</a>
        <a href="billing.html" class="site-toggle-link">Billing</a>
        <a href="files.html" class="site-toggle-link">Files</a>
        <a href="contacts.html" class="site-toggle-link">Staff</a>
      </nav>
      <div class="header-right" style="display: flex; align-items: center; gap: 0.75rem;">
        <a href="login.html" id="auth-sign-in-btn" class="glass-btn btn-sm" style="display: none; white-space: nowrap;">Sign In</a>
        <div id="auth-profile-menu" style="display: none; position: relative;">
          <button id="profile-dropdown-btn" class="glass-btn" style="padding: 0.25rem 0.5rem; display: flex; align-items: center; gap: 0.5rem; border-radius: 20px; cursor: pointer;">
            <div id="auth-user-avatar" style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--color-blue), var(--color-turquoise)); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.95rem; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">?</div>
            <span id="auth-user-name" style="font-size: 0.9rem; font-weight: 600; color: var(--color-blue-dark); display: none; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
            <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--text-muted); margin-right: 0.25rem;"></i>
          </button>
          
          <div id="profile-dropdown-menu" class="glass-panel" style="display: none; position: absolute; top: calc(100% + 0.5rem); right: 0; min-width: 200px; z-index: 999; flex-direction: column; padding: 0.5rem; gap: 0.25rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 12px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px);">
            <a href="profile.html" class="dropdown-item" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; color: var(--text-color); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: background 0.2s;">
              <i data-lucide="user" style="width: 16px; height: 16px; color: var(--color-blue);"></i> My Profile
            </a>
            <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 0.25rem 0;">
            <button onclick="signOut()" class="dropdown-item" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; color: var(--text-color); text-decoration: none; font-size: 0.9rem; font-weight: 500; background: none; border: none; cursor: pointer; width: 100%; text-align: left; transition: background 0.2s;">
              <i data-lucide="log-out" style="width: 16px; height: 16px; color: #ef4444;"></i> Sign Out
            </button>
          </div>
        </div>
        <button class="mobile-menu-btn" aria-label="Open Menu"><i data-lucide="menu"></i></button>
      </div>
    </header>

    <section class="hub-hero glass-panel">
      <div>
        <span class="hero-eyebrow">Personalize</span>
        <h1>My Profile</h1>
      </div>
    </section>

    <section class="client-list-shell" style="max-width: 600px; margin: 2rem auto;">
      <article class="glass-panel" style="padding: 2rem;">
        <form id="profile-form" style="display: flex; flex-direction: column; gap: 1.5rem;">
          
          <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: center; margin-bottom: 1rem;">
             <div id="profile-avatar-preview" style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--color-blue), var(--color-turquoise)); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 2.5rem; border: 4px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">?</div>
             <p style="font-size: 0.9rem; color: var(--text-muted);">Avatar updates automatically based on email</p>
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="profile-email" style="font-weight: 600; font-size: 0.9rem;">Email Address</label>
            <input type="email" id="profile-email" disabled style="padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.02); color: var(--text-muted); cursor: not-allowed; font-family: inherit;">
          </div>
          
          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="profile-name" style="font-weight: 600; font-size: 0.9rem;">Full Name</label>
            <input type="text" id="profile-name" required placeholder="Enter your full name" style="padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); font-family: inherit; font-size: 1rem; transition: border-color 0.2s;">
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <label for="profile-role" style="font-weight: 600; font-size: 0.9rem;">Role</label>
            <input type="text" id="profile-role" disabled style="padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.02); color: var(--text-muted); cursor: not-allowed; font-family: inherit; text-transform: uppercase;">
          </div>

          <div style="margin-top: 1rem; display: flex; justify-content: flex-end;">
            <button type="submit" class="glass-btn primary" id="save-profile-btn" style="padding: 0.75rem 2rem;">
              <i data-lucide="save"></i> Save Changes
            </button>
          </div>
          <div id="profile-message" style="display: none; padding: 1rem; border-radius: 8px; text-align: center; font-weight: 500;"></div>
        </form>
      </article>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=12"></script>
  <script src="auth-utils-v8.js?v=12"></script>
  <script src="auth-guard-v9.js?v=12"></script>
  <script src="supabase-data.js"></script>
  <script src="nav.js"></script>
  <script src="profile.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
